<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Vídeos</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .video {
      max-width: 800px;
      margin: 25px auto;
      background: #222;
      padding: 15px;
      border-radius: 12px;
    }

    iframe {
      width: 100%;
      height: 450px;
      border: none;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      iframe {
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <h1>🎬 Meus Vídeos</h1>

  <div class="video">
    <h2>Vídeo 1</h2>
    <iframe
      src="https://www.youtube.com/embed/T7ZcyiMj18M"
      allowfullscreen>
    </iframe>
  </div>

  <div class="video">
    <h2>Vídeo 2</h2>
    <iframe
      src="https://www.youtube.com/embed/sVkXZuou2DM"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
