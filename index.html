    body {

    header {

    .container {

      padding: 20px;

    .video {

    }

    .video h2 {

      margin-top: 0;
    }

    iframe {
      width: 100%;

      border: 0;

    }

    footer {

      padding: 25px;
      color: #888;
    }
  </style>
</head>
