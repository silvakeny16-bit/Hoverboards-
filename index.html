<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RunnerBoards — Leaderboard</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#520000;color:#fff}
body{
  background:
    linear-gradient(180deg,rgba(90,0,0,.78),rgba(95,0,0,.92)),
    radial-gradient(circle at 20% 20%,#d22 0 8%,transparent 25%),
    linear-gradient(135deg,#8d0000,#4d0000);
}
button,input,select{font:inherit}
button{cursor:pointer}
.top{height:108px;background:#a90000;display:flex;align-items:center;padding:18px 28px;gap:18px;box-shadow:0 2px 10px #300}
.logo{height:68px;width:130px;border:1px solid #e44;border-radius:8px;background:#980000;display:flex;align-items:center;gap:12px;padding:10px;font-size:35px}
.hamb{font-size:32px}.topicons{margin-left:auto;display:flex;gap:30px;font-size:29px;align-items:center}
.page{max-width:980px;margin:auto}
.hero{margin-top:0;min-height:310px;padding:35px 28px 0;background:linear-gradient(180deg,#a30b0b,#750000);border-radius:0 0 10px 10px}
.game{display:flex;gap:25px;align-items:center}
.icon{width:124px;height:124px;border-radius:10px;background:linear-gradient(135deg,#42b5ff,#ffe36a);display:flex;align-items:center;justify-content:center;font-size:62px;flex:none}
h1{font-size:32px;margin:0 0 15px}.pills{display:flex;flex-wrap:wrap;gap:8px}.pill{background:#ddd;color:#444;border-radius:10px;padding:9px 13px}
.boost{margin-top:35px;background:#ff4a4a;border:0;border-radius:8px;color:white;padding:13px 22px;font-size:23px;font-weight:bold}
.tabs{display:flex;gap:36px;margin-top:28px;border-bottom:3px solid #a22;padding:0 12px}
.tab{padding:18px 0;font-size:24px}.active{border-bottom:4px solid #fff}
.panel{margin:30px 14px;background:rgba(145,0,0,.88);border:1px solid #b72;border-radius:10px;padding:14px}
.filters{display:flex;flex-wrap:wrap;gap:10px}.filter{border:0;border-radius:9px;padding:15px 18px;background:#610000;color:#fff;font-weight:bold;font-size:18px}.filter.sel{background:#eee;color:#222}
label{display:block;color:#ddd;font-size:19px;margin:18px 0 8px}
select,.field{width:100%;background:#570000;color:#eee;border:1px solid #8c2222;border-radius:8px;padding:15px;font-size:18px}
.versions{display:flex;max-width:430px;background:#570000;border-radius:9px;overflow:hidden}
.ver{flex:1;border:0;background:transparent;color:#ddd;padding:14px 10px;font-weight:bold;font-size:18px}.ver.sel{background:#eee;color:#222;border-radius:8px}
.switch{display:flex;background:#570000;border-radius:9px;overflow:hidden;margin-top:18px}
.switch button{flex:1;padding:14px;border:0;background:transparent;color:#ddd;font-weight:bold}.switch .sel{background:#eee;color:#222;border-radius:8px}
.actions{display:flex;gap:10px;margin:14px 0}.small{width:86px;background:#650000;border:1px solid #a33;color:white;border-radius:8px;font-size:23px}.submit{flex:1;background:#eee;color:#222;border:0;border-radius:8px;font-weight:bold;font-size:21px}
table{width:100%;border-collapse:collapse;margin-top:8px;min-width:680px}th,td{padding:16px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}th{font-size:19px}td{font-size:18px}.scroll{overflow-x:auto}
.medal{font-size:20px}.rank{width:45px}.player{font-weight:bold}.date{color:#eee}.time{text-align:right;white-space:nowrap}
.empty{text-align:center;padding:35px;color:#ddd}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}
.modalbox{width:min(900px,100%);background:#700000;border-radius:12px;padding:16px}.close{float:right;background:#420000;color:white;border:0;border-radius:50%;width:40px;height:40px;font-size:22px}.video{position:relative;padding-top:56.25%;margin-top:12px}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.danger{background:#450000;color:#ffb0b0;border:1px solid #a44;padding:11px;border-radius:8px}
@media(max-width:650px){.top{height:88px;padding:12px 16px}.logo{width:130px}.topicons{gap:14px}.hero{padding:28px 18px 0}.game{gap:14px}.icon{width:95px;height:95px;font-size:45px}h1{font-size:25px}.panel{margin:18px 8px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.tabs{gap:20px}.tab{font-size:18px}}
</style>
</head>
<body>
<header class="top"><div class="logo">🏆 <span class="hamb">☰</span></div><div class="topicons">⌕　✉　♧　●</div></header>
<main class="page">
<section class="hero">
  <div class="game">
    <div class="icon">🏃</div>
    <div><h1>Subway Surfers <span style="font-weight:normal">(2012)</span></h1><div class="pills"><span class="pill">Android</span><span class="pill">iOS</span><span class="pill">WindowsPhone</span><span class="pill">Web</span></div></div>
  </div>
  <button class="boost">🛹 Boost　65</button>
  <div class="tabs"><div class="tab active">Leaderboards</div><div class="tab">News　21</div><div class="tab">Guides　7</div><div class="tab">•••</div></div>
</section>

<section class="panel">
  <div class="filters">
    <button class="filter sel" data-cat="No Coins">No Coins</button>
    <button class="filter" data-cat="Coins">Coins</button>
    <button class="filter" data-cat="Mystery Hurdles">Mystery Hurdles</button>
    <button class="filter" data-cat="Score (x38-)">Score (x38-)</button>
    <button class="filter" data-cat="Score (x39+)">Score (x39+)</button>
    <button class="filter" data-cat="All Powerups">All Powerups</button>
    <button class="filter" data-cat="Any%">Any%</button>
    <button class="filter" data-cat="Obtain Item">Obtain Item</button>
    <button class="filter" data-cat="Mystery box">Mystery box</button>
  </div>

  <label>No Coin</label>
  <select id="keys"><option>No Hoverboard/No Keys</option><option>Hoverboard</option><option>Keys</option><option>Hoverboard + Keys</option></select>

  <label>Version</label>
  <div class="versions" id="versions">
    <button class="ver sel" data-v="Mobile">Mobile</button><button class="ver" data-v="Emulator">Emulator</button><button class="ver" data-v="Web">Web</button><button class="ver" data-v="iOS">iOS</button>
  </div>

  <div class="switch"><button class="sel">☷　Leaderboard</button><button>◷　History</button></div>
  <div class="actions"><button class="small" title="Filtros">☷</button><button class="small" title="Regras">📖</button><button class="submit" id="openForm">⊕　Submit run</button></div>

  <div class="scroll"><table><thead><tr><th class="rank">#</th><th>Player</th><th>Date</th><th>Version</th><th class="time">Time</th><th>Video</th></tr></thead><tbody id="runs"></tbody></table></div>
</section>
</main>

<div class="modal" id="modal">
 <div class="modalbox">
  <button class="close" id="close">×</button>
  <h2>Submit run</h2>
  <form id="form">
   <div class="formgrid">
    <div><label>Player</label><input class="field" id="name" required placeholder="Seu nome"></div>
    <div><label>Time</label><input class="field" id="time" required placeholder="1h 39m 47s 283ms"></div>
    <div><label>Data da corrida</label><input class="field" id="date" type="date" required></div>
    <div><label>Vídeo (YouTube)</label><input class="field" id="video" placeholder="Cole o link do vídeo"></div>
    <div class="full"><label>Rank / posição</label><input class="field" id="rank" type="number" min="1" placeholder="Ex.: 20"></div>
    <div class="full"><button class="submit" style="padding:14px" type="submit">⊕　Envia corrida</button></div>
   </div>
  </form>
 </div>
</div>

<script>
const KEY='runnerboards_runs_v1';
let runs=JSON.parse(localStorage.getItem(KEY)||'[]');
let category='No Coins', version='Mobile', keyMode='No Hoverboard/No Keys';

document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');category=b.dataset.cat;render()});
document.querySelectorAll('.ver').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ver').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');version=b.dataset.v;render()});
document.getElementById('keys').onchange=e=>{keyMode=e.target.value;render()};
const modal=document.getElementById('modal');
document.getElementById('openForm').onclick=()=>{document.getElementById('date').value=new Date().toISOString().slice(0,10);modal.classList.add('show')};
document.getElementById('close').onclick=()=>modal.classList.remove('show');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};

function youtubeId(url){
  try{let u=new URL(url); if(u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0]; return u.searchParams.get('v')||((u.pathname.match(/\/embed\/([^/]+)/)||[])[1]);}catch{return null}
}
function relativeDate(s){
 const d=new Date(s+'T12:00:00'), now=new Date(), diff=Math.max(0,Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000));
 if(diff===0)return'hoje'; if(diff===1)return'1 dia atrás'; if(diff<30)return diff+' dias atrás';
 if(diff<365){let m=Math.floor(diff/30);return m+(m===1?' mês atrás':' meses atrás')}
 let y=Math.floor(diff/365);return y+(y===1?' ano atrás':' anos atrás')
}
function save(){localStorage.setItem(KEY,JSON.stringify(runs))}
function render(){
 const tb=document.getElementById('runs'); tb.innerHTML='';
 const list=runs.filter(r=>r.category===category&&r.version===version&&r.keyMode===keyMode).sort((a,b)=>(a.rank||999999)-(b.rank||999999));
 if(!list.length){tb.innerHTML='<tr><td colspan="6" class="empty">Nenhuma corrida ainda. Clique em “Submit run” para adicionar a sua.</td></tr>';return}
 list.forEach((r,i)=>{
  const tr=document.createElement('tr'); const id=youtubeId(r.video||'');
  tr.innerHTML=`<td class="rank">${r.rank||i+1}</td><td class="player">${escapeHtml(r.name)}</td><td class="date">${relativeDate(r.date)}</td><td>${r.version}</td><td class="time">${escapeHtml(r.time)}</td><td>${id?'<button class="danger watch" data-id="'+id+'">▶ Assistir</button>':'—'}</td>`;
  tb.appendChild(tr);
 });
 document.querySelectorAll('.watch').forEach(b=>b.onclick=()=>{modal.classList.add('show');document.querySelector('.modalbox').innerHTML='<button class="close" onclick="location.reload()">×</button><h2>Assistir corrida</h2><div class="video"><iframe src="https://www.youtube.com/embed/'+b.dataset.id+'?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'});
}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('form').onsubmit=e=>{
 e.preventDefault();
 runs.push({name:document.getElementById('name').value.trim(),time:document.getElementById('time').value.trim(),date:document.getElementById('date').value,video:document.getElementById('video').value.trim(),rank:Number(document.getElementById('rank').value)||null,category,version,keyMode});
 save();modal.classList.remove('show');e.target.reset();render();
};
render();
</script>
</body>
</html>                                           </html>
