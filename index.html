<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RunnerBoards — Subway Surfers</title>

<style>
*{box-sizing:border-box}

:root{
  --red:#5c0000;
  --red2:#8e0909;
  --red3:#b31111;
  --dark:#300000;
  --text:#fff;
}

body{
  margin:0;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,100,0,.25),transparent 30%),
    linear-gradient(135deg,#bd1700,#690000 48%,#300000);
  min-height:100vh;
}

button,input,select{font:inherit}

button{cursor:pointer}

.hero{
  padding:18px 16px 0;
  min-height:260px;
  background:linear-gradient(180deg,rgba(125,0,0,.95),rgba(93,0,0,.72));
}

.topbar{
  max-width:1100px;
  margin:auto;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.trophy{font-size:34px}

.brand h1{
  margin:0;
  font-size:20px;
}

.brand small{opacity:.7}

.menu{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  color:white;
  border-radius:8px;
  padding:9px 14px;
  font-size:22px;
}

.boardtitle{
  max-width:1100px;
  margin:42px auto 0;
}

.game{
  display:inline-block;
  background:#d03b2e;
  padding:10px 17px;
  border-radius:7px;
  font-weight:bold;
  font-size:20px;
}

.tabs{
  max-width:1100px;
  margin:35px auto 0;
  display:flex;
  gap:30px;
}

.tab{
  padding:14px 0;
  border:0;
  background:none;
  color:white;
  font-size:18px;
  font-weight:bold;
}

.tab.active{
  border-bottom:3px solid white;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding-bottom:40px;
}

.panel{
  background:rgba(88,0,0,.86);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.categories{
  padding:20px 16px;
}

.cat{
  background:#410000;
  border:0;
  color:white;
  padding:11px 16px;
  margin:0 7px 8px 0;
  border-radius:6px;
  font-weight:bold;
}

.cat.active{
  background:#eee;
  color:#333;
}

.controls{
  display:flex;
  gap:10px;
  padding:14px 16px;
  border-top:1px solid rgba(255,255,255,.1);
  flex-wrap:wrap;
}

.controls select,
.controls input{
  background:#fff;
  color:#222;
  border:0;
  border-radius:6px;
  padding:11px;
}

.submit{
  background:#eee;
  color:#333;
  border:0;
  border-radius:7px;
  padding:11px 18px;
  font-weight:bold;
}

.table-wrap{
  overflow-x:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}

.table th{
  text-align:left;
  padding:14px 16px;
  background:#410000;
}

.table td{
  padding:13px 16px;
  border-top:1px solid rgba(255,255,255,.08);
}

.rank-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#3e0000;
  font-weight:900;
}

.rank-1{
  background:#d8a500;
  color:#3a2100;
}

.rank-2{
  background:#b9c0c7;
  color:#222;
}

.rank-3{
  background:#b8783e;
  color:#222;
}

.player{
  font-weight:bold;
}

.score{
  font-weight:bold;
}

.delete{
  background:#8e0909;
  color:white;
  border:1px solid rgba(255,255,255,.2);
  border-radius:6px;
  padding:8px 11px;
  font-weight:bold;
}

.history{
  display:none;
  padding:20px;
}

.history h2{
  margin-top:0;
}

.history-item{
  background:#3d0000;
  border:1px solid rgba(255,255,255,.1);
  border-radius:8px;
  padding:14px;
  margin-bottom:10px;
}

.history-actions{
  margin-top:10px;
}

.empty{
  text-align:center;
  padding:35px;
  color:#e5bebe;
}

.modalbg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal{
  width:min(600px,100%);
  background:#570000;
  border:1px solid #b33;
  border-radius:10px;
  padding:20px;
}

.modal h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid label{
  font-size:13px;
  color:#eabbbb;
}

.grid input{
  width:100%;
  margin-top:5px;
  padding:11px;
  border:0;
  border-radius:6px;
}

.full{
  grid-column:1/-1;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modal-actions button{
  border:0;
  border-radius:6px;
  padding:11px 16px;
  font-weight:bold;
}

.ok{
  background:#eee;
  color:#222;
}

.cancel{
  background:#390000;
  color:white;
}

@media(max-width:650px){
  .hero{min-height:245px}

  .boardtitle{margin-top:28px}

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .controls>*{
    width:100%;
  }
}
</style>
</head>

<body>

<header class="hero">

  <div class="topbar">

    <div class="brand">
      <span class="trophy">🏆</span>

      <div>
        <h1>RunnerBoards</h1>
        <small>Subway Surfers</small>
      </div>
    </div>

    <button class="menu">☰</button>

  </div>

  <div class="boardtitle">
    <div class="game">🛹 &nbsp;Subway Surfers</div>
  </div>

  <nav class="tabs">
    <button id="rankingTab" class="tab active">🏆 Ranking</button>
    <button id="historyTab" class="tab">📋 Partidas</button>
  </nav>

</header>

<main class="wrap">

<section id="rankingPage" class="panel">

  <div class="categories">

    <button class="cat active" data-lg="Todas">Todas</button>
    <button class="cat" data-lg="LG 1">LG 1</button>
    <button class="cat" data-lg="LG 2">LG 2</button>
    <button class="cat" data-lg="LG 3">LG 3</button>
    <button class="cat" data-lg="LG 4">LG 4</button>

  </div>

  <div class="controls">

    <select id="lgFilter">
      <option value="Todas">Todas as LGs</option>
      <option value="LG 1">LG 1</option>
      <option value="LG 2">LG 2</option>
      <option value="LG 3">LG 3</option>
      <option value="LG 4">LG 4</option>
    </select>

    <button class="submit" id="newMatch">
      ➕ Enviar partida
    </button>

  </div>

  <div class="table-wrap">

    <table class="table">

      <thead>
        <tr>
          <th>Pos.</th>
          <th>Jogador</th>
          <th>LG</th>
          <th>Pontuação</th>
          <th>Partida</th>
        </tr>
      </thead>

      <tbody id="rankingBody"></tbody>

    </table>

  </div>

  <div id="emptyRanking" class="empty">
    Nenhuma partida cadastrada ainda.
  </div>

</section>


<section id="historyPage" class="panel history">

  <h2>📋 Histórico de partidas</h2>

  <div id="historyList"></div>

</section>

</main>


<div id="modalBg" class="modalbg">

  <div class="modal">

    <h2>🏁 Enviar partida</h2>

    <div class="grid">

      <label>
        Jogador
        <input id="playerName" placeholder="Nome do jogador">
      </label>

      <label>
        LG
        <select id="playerLG">
          <option>LG 1</option>
          <option>LG 2</option>
          <option>LG 3</option>
          <option>LG 4</option>
        </select>
      </label>

      <label>
        Pontuação
        <input id="playerScore" type="number" min="0" placeholder="Ex: 125000">
      </label>

      <label>
        ID da partida
        <input id="matchId" placeholder="Ex: CORRIDA-001">
      </label>

      <label class="full">
        Observação
        <input id="comment" placeholder="Opcional">
      </label>

    </div>

    <div class="modal-actions">

      <button class="ok" id="saveMatch">
        Salvar partida
      </button>

      <button class="cancel" id="closeModal">
        Cancelar
      </button>

    </div>

  </div>

</div>


<script>

const STORAGE_KEY = "runnerboards_partidas";

let matches = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "[]"
);

let selectedLG = "Todas";


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(matches)
  );

}


function formatScore(score){

  return Number(score).toLocaleString("pt-BR");

}


function renderRanking(){

  const body = document.getElementById("rankingBody");
  const empty = document.getElementById("emptyRanking");

  body.innerHTML = "";

  let list = [...matches];

  if(selectedLG !== "Todas"){
    list = list.filter(
      item => item.lg === selectedLG
    );
  }

  /*
    MAIOR PONTUAÇÃO = MELHOR POSIÇÃO
  */

  list.sort(
    (a,b) => Number(b.score) - Number(a.score)
  );

  if(list.length === 0){

    empty.style.display = "block";
    return;

  }

  empty.style.display = "none";

  /*
    Limite visual de 12.000 jogadores
  */

  list.slice(0,12000).forEach((item,index)=>{

    const position = index + 1;

    const tr = document.createElement("tr");

    let rankClass = "";

    if(position === 1) rankClass = "rank-1";
    if(position === 2) rankClass = "rank-2";
    if(position === 3) rankClass = "rank-3";

    tr.innerHTML = `

      <td>
        <span class="rank-badge ${rankClass}">
          ${position}
        </span>
      </td>

      <td>
        <span class="player">
          ${escapeHTML(item.name)}
        </span>
      </td>

      <td>
        ${escapeHTML(item.lg)}
      </td>

      <td>
        <span class="score">
          ${formatScore(item.score)}
        </span>
      </td>

      <td>
        ${escapeHTML(item.match)}
      </td>

    `;

    body.appendChild(tr);

  });

}


function renderHistory(){

  const list = document.getElementById("historyList");

  list.innerHTML = "";

  if(matches.length === 0){

    list.innerHTML =
      '<div class="empty">Nenhuma partida cadastrada.</div>';

    return;

  }

  const ordered = [...matches].reverse();

  ordered.forEach(item=>{

    const div = document.createElement("div");

    div.className = "history-item";

    div.innerHTML = `

      <strong>${escapeHTML(item.name)}</strong>

      <br>

      LG:
      <strong>${escapeHTML(item.lg)}</strong>

      <br>

      Pontuação:
      <strong>${formatScore(item.score)}</strong>

      <br>

      Partida:
      ${escapeHTML(item.match)}

      ${
        item.comment
        ? `<br>💬 ${escapeHTML(item.comment)}`
        : ""
      }

      <div class="history-actions">

        <button
          class="delete"
          onclick="deleteMatch('${item.id}')">
          🗑️ Excluir partida
        </button>

      </div>

    `;

    list.appendChild(div);

  });

}


function deleteMatch(id){

  const match = matches.find(
    item => item.id === id
  );

  if(!match) return;

  const confirmDelete = confirm(
    "Tem certeza que deseja excluir esta partida?"
  );

  if(!confirmDelete) return;

  matches = matches.filter(
    item => item.id !== id
  );

  saveData();

  renderRanking();
  renderHistory();

}


function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* MODAL */

const modalBg =
  document.getElementById("modalBg");

document
  .getElementById("newMatch")
  .onclick = () => {

    modalBg.style.display = "flex";

  };


document
  .getElementById("closeModal")
  .onclick = () => {

    modalBg.style.display = "none";

  };


modalBg.addEventListener("click",(event)=>{

  if(event.target === modalBg){

    modalBg.style.display = "none";

  }

});


/* SALVAR PARTIDA */

document
  .getElementById("saveMatch")
  .onclick = () => {

    const name =
      document.getElementById("playerName")
      .value.trim();

    const lg =
      document.getElementById("playerLG")
      .value;

    const score =
      Number(
        document.getElementById("playerScore")
        .value
      );

    const match =
      document.getElementById("matchId")
      .value.trim();

    const comment =
      document.getElementById("comment")
      .value.trim();


    if(!name){

      alert("Digite o nome do jogador.");
      return;

    }

    if(!score || score < 0){

      alert("Digite uma pontuação válida.");
      return;

    }

    if(!match){

      alert("Digite o ID da partida.");
      return;

    }


    const newMatch = {

      id:
        Date.now().toString()
        + Math.random()
          .toString(16)
          .slice(2),

      name:name,

      lg:lg,

      score:score,

      match:match,

      comment:comment,

      createdAt:
        new Date().toISOString()

    };


    matches.push(newMatch);

    saveData();

    renderRanking();
    renderHistory();

    document.getElementById("playerName").value = "";
    document.getElementById("playerScore").value = "";
    document.getElementById("matchId").value = "";
    document.getElementById("comment").value = "";

    modalBg.style.display = "none";

  };


/* FILTRO LG */

document
  .getElementById("lgFilter")
  .addEventListener("change",(event)=>{

    selectedLG = event.target.value;

    document
      .querySelectorAll(".cat")
      .forEach(button=>{
        button.classList.toggle(
          "active",
          button.dataset.lg === selectedLG
        );
      });

    renderRanking();

  });


document
  .querySelectorAll(".cat")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      selectedLG =
        button.dataset.lg;

      document
        .getElementById("lgFilter")
        .value = selectedLG;

      document
        .querySelectorAll(".cat")
        .forEach(b=>{
          b.classList.remove("active");
        });

      button.classList.add("active");

      renderRanking();

    });

  });


/* ABAS */

const rankingPage =
  document.getElementById("rankingPage");

const historyPage =
  document.getElementById("historyPage");

document
  .getElementById("rankingTab")
  .onclick = () => {

    rankingPage.style.display = "block";
    historyPage.style.display = "none";

    document
      .getElementById("rankingTab")
      .classList.add("active");

    document
      .getElementById("historyTab")
      .classList.remove("active");

  };


document
  .getElementById("historyTab")
  .onclick = () => {

    rankingPage.style.display = "none";
    historyPage.style.display = "block";

    document
      .getElementById("historyTab")
      .classList.remove("active");

    document
      .getElementById("historyTab")
      .classList.add("active");

  };


/* INICIAR */

renderRanking();
renderHistory();

</script>

</body>
            </html>
