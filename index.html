<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedRun Leaderboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#120808;
  color:white;
}

header{
  background:linear-gradient(135deg,#8b0000,#420000);
  padding:25px 20px;
  text-align:center;
  border-bottom:2px solid #b30000;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  margin:8px 0 0;
  color:#ddd;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.submit{
  background:#c40000;
  color:white;
}

.submit:hover{
  background:#e00000;
}

.ranking{
  background:#1d0d0d;
  border:1px solid #4d2020;
  border-radius:12px;
  overflow:hidden;
}

.row{
  display:grid;
  grid-template-columns:55px 1fr 130px 150px 120px 120px;
  align-items:center;
  gap:10px;
  padding:15px;
  border-bottom:1px solid #3b1818;
}

.row:last-child{
  border-bottom:0;
}

.head{
  background:#320909;
  font-weight:bold;
}

.position{
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

.time{
  font-weight:bold;
  color:#ffb3b3;
}

.country{
  display:flex;
  align-items:center;
  gap:7px;
}

.sent{
  color:#aaa;
  font-size:14px;
}

.watch{
  background:#eee;
  color:#111;
}

.watch:hover{
  background:white;
}

.empty{
  padding:35px;
  text-align:center;
  color:#aaa;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  justify-content:center;
  align-items:center;
  padding:15px;
  z-index:100;
}

.modalbox{
  width:100%;
  max-width:500px;
  background:#1d0d0d;
  border:1px solid #6b2020;
  border-radius:12px;
  padding:22px;
  position:relative;
}

.modalbox h2{
  margin-top:0;
}

.close{
  position:absolute;
  right:12px;
  top:10px;
  background:#550000;
  color:white;
  font-size:20px;
}

input,select{
  width:100%;
  padding:12px;
  margin:7px 0 14px;
  border-radius:7px;
  border:1px solid #663333;
  background:#120808;
  color:white;
}

.formbutton{
  width:100%;
  background:#c40000;
  color:white;
}

.video{
  position:relative;
  width:100%;
  padding-top:56.25%;
}

.video iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  border-radius:8px;
}

@media(max-width:850px){

  .row{
    grid-template-columns:45px 1fr 110px 110px;
  }

  .head div:nth-child(4),
  .head div:nth-child(5),
  .row div:nth-child(4),
  .row div:nth-child(5){
    display:none;
  }
}

@media(max-width:550px){

  .row{
    grid-template-columns:40px 1fr 100px;
  }

  .head div:nth-child(4),
  .head div:nth-child(5),
  .head div:nth-child(6),
  .row div:nth-child(4),
  .row div:nth-child(5),
  .row div:nth-child(6){
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <h1>🏆 SpeedRun Leaderboard</h1>
  <p>Ranking mundial de speedruns</p>
</header>

<div class="container">

  <div class="top">
    <h2>Ranking</h2>

    <button class="submit" onclick="openSubmit()">
      + Enviar corrida
    </button>
  </div>

  <div class="ranking">

    <div class="row head">
      <div>#</div>
      <div>Jogador</div>
      <div>Tempo</div>
      <div>País</div>
      <div>Vídeo</div>
      <div>Enviada</div>
    </div>

    <div id="rankingList"></div>

  </div>

</div>


<!-- MODAL ENVIAR -->
<div class="modal" id="submitModal">

  <div class="modalbox">

    <button class="close" onclick="closeSubmit()">×</button>

    <h2>Enviar corrida</h2>

    <label>Jogador</label>
    <input
      id="player"
      placeholder="Nome do jogador">

    <label>Tempo</label>
    <input
      id="time"
      placeholder="Ex: 14:39.383">

    <label>País</label>

    <select id="country">

      <option value="🇧🇷 Brasil">
        🇧🇷 Brasil
      </option>

      <option value="🇺🇸 Estados Unidos">
        🇺🇸 Estados Unidos
      </option>

      <option value="🇬🇧 Reino Unido">
        🇬🇧 Reino Unido
      </option>

      <option value="🇨🇦 Canadá">
        🇨🇦 Canadá
      </option>

      <option value="🇯🇵 Japão">
        🇯🇵 Japão
      </option>

      <option value="🇩🇪 Alemanha">
        🇩🇪 Alemanha
      </option>

      <option value="🇫🇷 França">
        🇫🇷 França
      </option>

      <option value="🇪🇸 Espanha">
        🇪🇸 Espanha
      </option>

      <option value="🇮🇹 Itália">
        🇮🇹 Itália
      </option>

      <option value="🌎 Outro">
        🌎 Outro
      </option>

    </select>

    <label>Link do vídeo</label>

    <input
      id="video"
      placeholder="https://youtube.com/...">

    <button
      class="formbutton"
      onclick="submitRun()">

      Enviar corrida

    </button>

  </div>

</div>


<!-- MODAL VÍDEO -->
<div class="modal" id="videoModal">

  <div class="modalbox">

    <button
      class="close"
      onclick="closeVideo()">
      ×
    </button>

    <h2>Assistir corrida</h2>

    <div class="video">

      <iframe
        id="videoFrame"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>

    </div>

  </div>

</div>


<script>

let runs = JSON.parse(
  localStorage.getItem("speedrunRuns") || "[]"
);


/* ABRIR FORMULÁRIO */

function openSubmit(){

  document.getElementById(
    "submitModal"
  ).style.display="flex";
}


/* FECHAR FORMULÁRIO */

function closeSubmit(){

  document.getElementById(
    "submitModal"
  ).style.display="none";
}


/* ENVIAR RUN */

function submitRun(){

  const player =
    document.getElementById("player")
    .value.trim();

  const time =
    document.getElementById("time")
    .value.trim();

  const country =
    document.getElementById("country")
    .value;

  const video =
    document.getElementById("video")
    .value.trim();


  if(!player || !time){

    alert(
      "Preencha o jogador e o tempo."
    );

    return;
  }


  const run = {

    id:Date.now(),

    player:player,

    time:time,

    country:country,

    video:video,

    createdAt:Date.now()

  };


  runs.push(run);


  localStorage.setItem(
    "speedrunRuns",
    JSON.stringify(runs)
  );


  closeSubmit();


  document.getElementById(
    "player"
  ).value="";

  document.getElementById(
    "time"
  ).value="";

  document.getElementById(
    "video"
  ).value="";


  renderRanking();

  alert(
    "Corrida enviada com sucesso!"
  );
}


/* TRANSFORMAR TEMPO EM MILISSEGUNDOS */

function timeToMilliseconds(time){

  const parts =
    time.split(":");


  if(parts.length === 2){

    const minutes =
      parseInt(parts[0]) || 0;

    const seconds =
      parseFloat(parts[1]) || 0;

    return (
      minutes * 60000 +
      seconds * 1000
    );
  }


  return (
    parseFloat(time) ||
    999999999
  );
}


/* TEMPO DESDE O ENVIO */

function timeAgo(timestamp){

  const seconds =
    Math.floor(
      (Date.now() - timestamp) / 1000
    );


  if(seconds < 60){

    return "Agora";
  }


  const minutes =
    Math.floor(seconds / 60);


  if(minutes < 60){

    return (
      "há " +
      minutes +
      " " +
      (minutes === 1
        ? "minuto"
        : "minutos")
    );
  }


  const hours =
    Math.floor(minutes / 60);


  if(hours < 24){

    return (
      "há " +
      hours +
      " " +
      (hours === 1
        ? "hora"
        : "horas")
    );
  }


  const days =
    Math.floor(hours / 24);


  if(days < 30){

    return (
      "há " +
      days +
      " " +
      (days === 1
        ? "dia"
        : "dias")
    );
  }


  const months =
    Math.floor(days / 30);


  if(months < 12){

    return (
      "há " +
      months +
      " " +
      (months === 1
        ? "mês"
        : "meses")
    );
  }


  const years =
    Math.floor(months / 12);


  return (
    "há " +
    years +
    " " +
    (years === 1
      ? "ano"
      : "anos")
  );
}


/* MOSTRAR RANKING */

function renderRanking(){

  const list =
    document.getElementById(
      "rankingList"
    );


  if(runs.length === 0){

    list.innerHTML =
      '<div class="empty">' +
      'Nenhuma corrida enviada ainda.' +
      '</div>';

    return;
  }


  const sorted =
    [...runs].sort(

      (a,b) =>

        timeToMilliseconds(a.time) -
        timeToMilliseconds(b.time)

    );


  list.innerHTML =

    sorted.map(
      (run,index) => `

      <div class="row">

        <div class="position">
          ${index + 1}
        </div>

        <div>
          ${escapeHtml(run.player)}
        </div>

        <div class="time">
          ${escapeHtml(run.time)}
        </div>

        <div class="country">
          ${escapeHtml(run.country)}
        </div>

        <div>

          ${
            run.video

            ?

            `<button
              class="watch"
              onclick="watchVideo('${encodeURIComponent(run.video)}')">
              ▶ Assistir
            </button>`

            :

            "-"
          }

        </div>

        <div class="sent">

          ${
            run.createdAt
              ? timeAgo(run.createdAt)
              : "Data antiga"
          }

        </div>

      </div>

    `
    ).join("");
}


/* ABRIR VÍDEO */

function watchVideo(encodedUrl){

  const url =
    decodeURIComponent(encodedUrl);


  let videoId = "";


  if(url.includes("youtu.be/")){

    videoId =
      url
      .split("youtu.be/")[1]
      .split(/[?&]/)[0];

  }


  else if(
    url.includes("youtube.com/watch")
  ){

    const params =
      new URL(url).searchParams;

    videoId =
      params.get("v");

  }


  else if(
    url.includes("youtube.com/shorts/")
  ){

    videoId =
      url
      .split("/shorts/")[1]
      .split(/[?&]/)[0];

  }


  if(!videoId){

    window.open(
      url,
      "_blank"
    );

    return;
  }


  document.getElementById(
    "videoFrame"
  ).src =
    "https://www.youtube.com/embed/" +
    videoId;


  document.getElementById(
    "videoModal"
  ).style.display="flex";
}


/* FECHAR VÍDEO */

function closeVideo(){

  document.getElementById(
    "videoFrame"
  ).src="";


  document.getElementById(
    "videoModal"
  ).style.display="none";
}


/* PROTEGER TEXTO DO HTML */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");
}


/* ATUALIZAR O "HÁ X TEMPO" */

setInterval(
  renderRanking,
  60000
);


/* CARREGAR RANKING */

renderRanking();

</script>

</body>
</html>
