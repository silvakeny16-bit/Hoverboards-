<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Keny Videos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0b0b0f;
    color: white;
    font-family: Arial, sans-serif;
}

/* TOPO */
header {
    padding: 22px;
    background: #111118;
    border-bottom: 1px solid #292936;
    text-align: center;
}

header h1 {
    font-size: 28px;
}

header p {
    color: #999;
    margin-top: 6px;
}

/* CONTEÚDO */
.container {
    width: 94%;
    max-width: 850px;
    margin: 25px auto;
}

/* CARD */
.card {
    background: #15151d;
    border: 1px solid #292936;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 25px;
}

.info {
    padding: 17px;
}

.info h2 {
    font-size: 20px;
    margin-bottom: 8px;
}

.info span {
    color: #999;
}

/* VÍDEO */
.video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
}

.video iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

/* BOTÃO */
.button {
    display: block;
    margin-top: 15px;
    padding: 13px;
    text-align: center;
    background: white;
    color: black;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
}

/* RODAPÉ */
footer {
    text-align: center;
    padding: 30px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🎥 Keny Videos</h1>
    <p>Meus melhores vídeos</p>
</header>

<div class="container">

    <!-- VÍDEO 1 -->
    <div class="card">

        <div class="video">
            <iframe
                src="https://www.youtube.com/embed/zd4tCr2BQFE"
                allowfullscreen>
            </iframe>
        </div>

        <div class="info">
            <h2>🏆 2h41m26s Top 1 Mobile</h2>
            <span>👤 Keny</span>

            <a class="button"
               href="https://youtu.be/zd4tCr2BQFE"
               target="_blank">
               ▶ Assistir no YouTube
            </a>
        </div>

    </div>


    <!-- VÍDEO 2 -->
    <div class="card">

        <div class="video">
            <iframe
                src="https://www.youtube.com/embed/T7ZcyiMj18M"
                allowfullscreen>
            </iframe>
        </div>

        <div class="info">
            <h2>🎮 Segundo Vídeo</h2>
            <span>👤 Keny</span>

            <a class="button"
               href="https://youtu.be/T7ZcyiMj18M"
               target="_blank">
               ▶ Assistir no YouTube
            </a>
        </div>

    </div>

</div>

<footer>
    © 2026 Keny Videos
</footer>

</body>
</html>
